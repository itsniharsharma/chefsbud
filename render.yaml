services:
  - type: web
    name: chefsbud-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Set these in Render dashboard (do NOT commit secrets):
      # MONGO_URI
      # JWT_SECRET
      # GEMINI_API_KEY
      # RAZORPAY_KEY_ID
      # RAZORPAY_KEY_SECRET
      # RAZORPAY_HYBRID_MONTHLY_PLAN_ID
      # RAZORPAY_WEBHOOK_SECRET
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
      - key: CORS_ORIGIN
        value: https://chefsbud.com,https://www.chefsbud.com
      - key: KEEP_ALIVE_TIMEOUT_MS
        value: 65000
      - key: HEADERS_TIMEOUT_MS
        value: 66000
      # Data Lifecycle Configuration
      - key: ARCHIVE_ENABLED
        value: 'true'
      - key: ARCHIVE_AFTER_DAYS
        value: '45'
      - key: ARCHIVE_BATCH_SIZE
        value: '1000'
      - key: PURGE_ENABLED
        value: 'true'
      - key: DELETE_AFTER_ARCHIVE_DAYS
        value: '1'
      - key: PURGE_BATCH_SIZE
        value: '500'
      - key: DRY_RUN_PURGE
        value: 'false'
      - key: PURGE_MAX_DURATION_MS
        value: '120000'
      - key: PURGE_INTERVAL_MINUTES
        value: '360'
      - key: ROLLUP_ENABLED
        value: 'true'
      - key: ROLLUP_AFTER_DAYS
        value: '90'
      - key: DAILY_ANALYTICS_RETENTION_DAYS
        value: '90'
      - key: AZURE_STORAGE_CONTAINER
        value: orders-archive
      - key: CRON_ARCHIVE
        value: '0 2 * * *'
      - key: CRON_PURGE
        value: '0 */6 * * *'
      - key: CRON_ROLLUP
        value: '0 3 * * *'
      - key: CRON_CLEANUP
        value: '0 4 * * *'
      # AZURE_STORAGE_CONNECTION_STRING set in Render dashboard
